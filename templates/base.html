<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ title or "Talao Wallet Guide" }}</title>
  <meta name="description" content="Guide to download and configure Talao Wallet for the France Identité EUDI Wallet Playground." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
</head>
<body>

<header class="navbar">
  <div class="container nav-content">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">Talao Wallet Guide</span>
    </a>

    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" data-nav-toggle>
      <span></span><span></span><span></span>
    </button>

    <nav class="nav-links" data-nav>
      <a href="/" class="{% if request.path=='/' %}active{% endif %}">Overview</a>
      <a href="/configure" class="{% if request.path.startswith('/configure') %} active{% endif %}">Configure</a>
      <a href="https://qhf0siml406.typeform.com/to/PdULRDIV?typeform-source=www.talao.io">Contact</a>
      <a class="pill" href="https://doc.wallet-provider.io/welcome" target="_blank" rel="noreferrer">
        Full documentation
      </a>
    </nav>
  </div>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="main-footer">
  <div class="container footer-grid">

    <div class="footer-left">
      <div class="footer-title">Web3 Digital Wallet</div>
      <div class="footer-subtitle">
        Educational guide for the EUDI Wallet Playground.
      </div>
      <div class="footer-meta">
        © {{ year }} — Version 0.6.5
      </div>
    </div>


    <div class="footer-social">
      <a href="https://twitter.com/Talao_io" target="_blank">
        <img src="{{ url_for('static', filename='img/twitter.png') }}" alt="Twitter">
      </a>
      <a href="https://www.linkedin.com/company/10175757/" target="_blank">
        <img src="{{ url_for('static', filename='img/linkedin.png') }}" alt="LinkedIn">
      </a>
      <a href="mailto:contact@talao.io">
        <img src="{{ url_for('static', filename='img/email.jpeg') }}" alt="Email">
      </a>
    </div>

  </div>
</footer>


<div class="toast" role="status" aria-live="polite" aria-atomic="true" data-toast>
  <span data-toast-text>Copied</span>
</div>

</body>
</html>
