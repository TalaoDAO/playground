<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ title or "Talao Wallet Guide" }}</title>
  <meta name="description" content="Guide to download and configure Talao Wallet for the France Identité EUDI Wallet Playground." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
</head>
<body>

<header class="navbar">
  <div class="container nav-content">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">Talao Wallet Guide</span>
    </a>

    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" data-nav-toggle>
      <span></span><span></span><span></span>
    </button>

    <nav class="nav-links" data-nav>
      <a href="/" class="{% if request.path=='/' %}active{% endif %}">Overview</a>
      <a href="/download" class="{% if request.path.startswith('/download') %}active{% endif %}">Download</a>
      <a href="/configure" class="{% if request.path.startswith('/configure') %}active{% endif %}">Configure</a>
      <a href="/playground" class="{% if request.path.startswith('/playground') %}active{% endif %}">Playground</a>
      <a href="/faq" class="{% if request.path.startswith('/faq') %}active{% endif %}">FAQ</a>
      <a class="pill" href="{{ playground_url }}" target="_blank" rel="noreferrer">Open Playground</a>
    </nav>
  </div>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <div class="container footer-content">
    <div class="footer-left">
      <div class="footer-title">Web3 Digital Wallet</div>
      <div class="footer-subtitle">Educational guide for the EUDI Wallet Playground.</div>
    </div>
    <div class="footer-right">
      <a href="https://talao.io" target="_blank" rel="noreferrer">talao.io</a>
      <span class="dot" aria-hidden="true">•</span>
      <span>© {{ year }}</span>
    </div>
  </div>
</footer>

<div class="toast" role="status" aria-live="polite" aria-atomic="true" data-toast>
  <span data-toast-text>Copied</span>
</div>

</body>
</html>
